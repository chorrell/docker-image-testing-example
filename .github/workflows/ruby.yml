name: Serverspec

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
      fail-fast: false

    name: Ruby ${{ matrix.ruby-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false
    - name: Install gems
      run: bundle install
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: network=host
    - name: Build Node.js 22 image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./22
        load: true
        tags: node-test:22
        cache-from: type=gha,scope=node22
        cache-to: type=gha,mode=max,scope=node22
    - name: Build Node.js 24 image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./24
        load: true
        tags: node-test:24
        cache-from: type=gha,scope=node24
        cache-to: type=gha,mode=max,scope=node24
    - name: Run tests
      run: bundle exec rake
